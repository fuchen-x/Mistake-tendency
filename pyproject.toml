[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mistake-tendency"
version = "0.1.0"
description = "Stage-1 experiment for inferring student mistake tendencies from FOUNDATIONALASSIST logs."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "anthropic>=0.40",
]

[project.scripts]
mistake-tendency = "mistake_tendency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

